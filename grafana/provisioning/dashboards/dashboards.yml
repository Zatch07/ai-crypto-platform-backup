apiVersion: 1

providers:
  - name: 'Crypto Platform Dashboards'
    orgId: 1
    folder: 'Crypto Platform'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
